name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --list_installed
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Test and compile Rust
        working-directory: rust-core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cargo test
          cargo install cargo-ndk --version 3.5.4 --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release
      - name: Compile Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ClaudeSwitcher-0.1.1-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeSwitcher-APK
          path: ClaudeSwitcher-0.1.1-preview.apk
      - name: Publish preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.1-preview.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" ClaudeSwitcher-0.1.1-preview.apk --target "$GITHUB_SHA" --title "Claude Switcher 0.1.1 – floating-window fix ($GITHUB_RUN_NUMBER)" --prerelease --notes "Debug-signed installable preview. Device login and session-isolation tests are still required. Future builds may require reinstalling if the signing key changes."
